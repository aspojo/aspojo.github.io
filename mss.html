<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSS 报文解析工具集</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-blue-600 text-white p-4">
    <h1 class="text-2xl font-bold">MSS 报文解析工具集</h1>
</header>

<nav class="container mx-auto p-4">
    <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Menu items will be dynamically inserted here -->
    </div>
</nav>

<script>
    // Sample data structure
    const menuData = [{
        "title": "联锁报文（cbi_agent）",
        "menus": [{
            "title": "SDM=>BiIOM全体报警和设备状态报文",
            "url": "./utils/cbi40.html"
        }, {
            "title": "SDM=>BiIOM变化报警和设备状态报文",
            "url": "./utils/cbi43.html"
        },{
            title: "leu报文解析器",
            url: "./utils/cbi55.html"
        },{
            title: "appconf_CBI.bin解析器",
            url: "./utils/cbi_bin.html"
        },{
            title: "SDM → BiIOM 全体机笼故障状态信息报文解析器 (MSG_ID=0x57)",
            url: "./utils/cbi57.html"
        },{
            title: "appconf_CBI.bin解析器V1",
            url: "./utils/appconf_bin/version1.html"
        },{
            title: "cbi websocket测试工具",
            url: "./utils/cbi_ws_test.html"
        }
        ]
    },{
        "title": "zc报文（zc_agent）",
        "menus": [{
            "title": "ZCM->BiIOM互联互通报文",
            "url": "./utils/zc20.html"
        },{
            "title": "zc前端接口zc/info数据解析器",
            "url": "./utils/zc_info_decode.html"
        },{
            title: "zc websocket测试工具",
            url: "./utils/zc_ws_test.html"
        }
        ]
    },{
        "title": "计轴报文（axle_agent）",
        "menus": [{
            "title": "科安达计轴->BiIOM 报警报文",
            "url": "./utils/axle_kad_70.html"
        },{
            "title": "科安达计轴old2系统状态帧报文组装工具",
            "url": "./utils/axle_kad_old2_msg_maker.html"
        }
        ]
    },{
        "title": "dti报文（dti_agent）",
        "menus": [{
            "title": "BiIOM-DTI 报文生成器",
            "url": "./utils/dti_msg_generator.html"
        },{
            "title": "BiIOM-DTI 报文解析器",
            "url": "./utils/dti_msg_decoder.html"
        }]
    }, {
        "title": "数据处理",
        "menus": [{
            "title": "格式转换",
            "url": "./utils/converter.html"
        }, {
            "title": "数据清洗",
            "url": "./utils/cleaner.html"
        }]
    }, {
        "title": "工具箱",
        "menus": [{
            "title": "日志监控脚本使用说明",
            "url": "./utils/monitor_logs.html"
        },{
            "title": "加密工具",
            "url": "./utils/encrypt.html"
        }, {
            "title": "解密工具",
            "url": "./utils/decrypt.html"
        }, {
            "title": "校验码生成",
            "url": "./utils/checksum.html"
        }, {
            "title": "WebSocket测试工具",
            "url": "./utils/ws_test.html"
        }]
    }];

    // Function to render menu items
    function renderMenus() {
        const container = document.getElementById('menu-container');

        menuData.forEach(section => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'bg-white rounded-lg shadow-md p-4';

            // Section title
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'text-xl font-semibold mb-3 text-blue-600';
            sectionTitle.textContent = section.title;
            sectionDiv.appendChild(sectionTitle);

            // Menu items
            const ul = document.createElement('ul');
            ul.className = 'space-y-2';

            section.menus.forEach(menu => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = menu.url;
                a.className = 'block text-blue-500 hover:text-blue-700 hover:underline';
                a.textContent = menu.title;
                a.target = '_blank';
                li.appendChild(a);
                ul.appendChild(li);
            });

            sectionDiv.appendChild(ul);
            container.appendChild(sectionDiv);
        });
    }

    // Render menus when page loads
    document.addEventListener('DOMContentLoaded', renderMenus);
</script>
</body>
</html>
