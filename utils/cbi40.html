<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM=>BiIOM全体报警和设备状态报文</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #2c3e50;
        }
        .container {
            max-width: 1366px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #34495e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .input-section {
            margin-bottom: 30px;
        }
        #hexInput {
            width: 100%;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        #hexInput:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
            outline: none;
        }
        #parseButton {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        #parseButton:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .info-section {
            margin: 20px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .split-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .split-section > div {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            max-height: 500px;
            overflow-y: auto;
        }
        h3 {
            color: #34495e;
            margin-top: 0;
            font-size: 1.3rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #e8f4f8;
        }
        .error {
            color: #e74c3c;
            font-weight: 600;
        }
        .bit-active {
            background-color: #e74c3c;
            color: white;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
            #parseButton {
                width: 100%;
                padding: 12px;
            }
            .split-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="input-section">
        <h2>SDM=>BiIOM全体报警和设备状态报文</h2>
        <textarea id="hexInput" rows="4" placeholder="请输入十六进制字符串（例如：AA00124020230715123000000001000000020001010001010155ABCD1234）"></textarea>
        <br>
        <button id="parseButton">解析</button>
    </div>
    <div class="info-section" id="infoSection"></div>
    <div class="split-section">
        <div id="alarmSection">
            <h3>报警数据</h3>
            <table id="alarmTable">
                <thead>
                <tr>
                    <th>字节序号</th>
                    <th>字节值</th>
                    <th>位 0</th>
                    <th>位 1</th>
                    <th>位 3</th>
                    <th>位 2</th>
                    <th>位 4</th>
                    <th>位 5</th>
                    <th>位 6</th>
                    <th>位 7</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="stateSection">
            <h3>状态数据</h3>
            <table id="stateTable">
                <thead>
                <tr>
                    <th>字节序号</th>
                    <th>字节值</th>
                    <th>位 0</th>
                    <th>位 1</th>
                    <th>位 3</th>
                    <th>位 2</th>
                    <th>位 4</th>
                    <th>位 5</th>
                    <th>位 6</th>
                    <th>位 7</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('parseButton').addEventListener('click', parseMessage);

    function parseMessage() {
        const hexInput = document.getElementById('hexInput').value.replace(/\s/g, '');
        if (!/^[0-9A-Fa-f]+$/.test(hexInput)) {
            displayError('无效的十六进制字符串');
            return;
        }

        const bytes = hexToBytes(hexInput);
        if (!validateMessage(bytes)) {
            displayError('报文格式无效');
            return;
        }

        const parsed = parseMessageData(bytes);
        displayInfo(parsed);
        displayData(parsed.alarmData, 'alarmTable', '报警数据', parsed.alarmNum);
        displayData(parsed.stateData, 'stateTable', '状态数据', parsed.stateNum);
    }

    function hexToBytes(hex) {
        const bytes = [];
        for (let i = 0; i < hex.length; i += 2) {
            bytes.push(parseInt(hex.substr(i, 2), 16));
        }
        return bytes;
    }

    function validateMessage(bytes) {
        if (bytes.length < 20) return false;
        if (bytes[0] !== 0xAA) return false;
        if (bytes[3] !== 0x40) return false;
        if (bytes[bytes.length - 5] !== 0x55) return false;
        const len = (bytes[1] << 8) | bytes[2];
        if (len !== bytes.length - 3) return false;
        return true;
    }

    function parseMessageData(bytes) {
        const result = {};
        result.header = bytes[0];
        result.len = (bytes[1] << 8) | bytes[2];
        result.msgId = bytes[3];
        result.stamp = {
            year: 2000 + bytes[4],
            month: bytes[5],
            day: bytes[6],
            hour: bytes[7],
            minute: bytes[8],
            second: bytes[9]
        };
        result.sn = (bytes[10] << 24) | (bytes[11] << 16) | (bytes[12] << 8) | bytes[13];
        result.cbiId = (bytes[14] << 24) | (bytes[15] << 16) | (bytes[16] << 8) | bytes[17];
        result.alarmNum = (bytes[18] << 8) | bytes[19];
        result.alarmData = bytes.slice(20, 20 + result.alarmNum);
        result.stateNum = (bytes[20 + result.alarmNum] << 8) | bytes[20 + result.alarmNum + 1];
        result.stateData = bytes.slice(20 + result.alarmNum + 2, 20 + result.alarmNum + 2 + result.stateNum);
        result.end = bytes[bytes.length - 5];
        result.crc = (bytes[bytes.length - 4] << 24) | (bytes[bytes.length - 3] << 16) | (bytes[bytes.length - 2] << 8) | bytes[bytes.length - 1];
        return result;
    }

    function displayInfo(parsed) {
        const infoSection = document.getElementById('infoSection');
        infoSection.innerHTML = `
            <strong>报文详情：</strong><br>
            帧头（HEADER）：0x${parsed.header.toString(16).padStart(2, '0').toUpperCase()}<br>
            帧长度（LEN）：${parsed.len} 字节<br>
            消息ID（MSG_ID）：0x${parsed.msgId.toString(16).padStart(2, '0').toUpperCase()}<br>
            时间戳（STAMP）：${parsed.stamp.year}-${parsed.stamp.month.toString().padStart(2, '0')}-${parsed.stamp.day.toString().padStart(2, '0')}
                   ${parsed.stamp.hour.toString().padStart(2, '0')}:${parsed.stamp.minute.toString().padStart(2, '0')}:${parsed.stamp.second.toString().padStart(2, '0')}<br>
            序列号（SN）：${parsed.sn}<br>
            联锁站编号（CBI_ID）：${parsed.cbiId}<br>
            报警数据长度（ALARM_NUM）：${parsed.alarmNum} 字节<br>
            状态数据长度（STATE_NUM）：${parsed.stateNum} 字节<br>
            帧尾（END）：0x${parsed.end.toString(16).padStart(2, '0').toUpperCase()}<br>
            CRC校验：0x${parsed.crc.toString(16).padStart(8, '0').toUpperCase()}
        `;
    }

    function displayData(data, tableId, dataType, dataNum) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = '';
        for (let i = 0; i < dataNum; i++) {
            const byte = data[i] || 0;
            const byteHex = '0x' + byte.toString(16).padStart(2, '0').toUpperCase();
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i + 1}</td>
                <td>${byteHex}</td>
                <td class="${byte & 1 ? 'bit-active' : ''}">${byte & 1} (${i * 8 + 0})</td>
                <td class="${(byte >> 1) & 1 ? 'bit-active' : ''}">${(byte >> 1) & 1} (${i * 8 + 1})</td>
                <td class="${(byte >> 2) & 1 ? 'bit-active' : ''}">${(byte >> 2) & 1} (${i * 8 + 2})</td>
                <td class="${(byte >> 3) & 1 ? 'bit-active' : ''}">${(byte >> 3) & 1} (${i * 8 + 3})</td>
                <td class="${(byte >> 4) & 1 ? 'bit-active' : ''}">${(byte >> 4) & 1} (${i * 8 + 4})</td>
                <td class="${(byte >> 5) & 1 ? 'bit-active' : ''}">${(byte >> 5) & 1} (${i * 8 + 5})</td>
                <td class="${(byte >> 6) & 1 ? 'bit-active' : ''}">${(byte >> 6) & 1} (${i * 8 + 6})</td>
                <td class="${(byte >> 7) & 1 ? 'bit-active' : ''}">${(byte >> 7) & 1} (${i * 8 + 7})</td>
            `;
            tbody.appendChild(row);
        }
    }

    function displayError(message) {
        const infoSection = document.getElementById('infoSection');
        infoSection.innerHTML = `<span class="error">错误：${message}</span>`;
        document.querySelector('#alarmTable tbody').innerHTML = '';
        document.querySelector('#stateTable tbody').innerHTML = '';
    }
</script>
</body>
</html>
