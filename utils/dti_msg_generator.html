<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiIOM-DTI 报文生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        label, input, button {
            margin: 10px 0;
        }
        input[type="text"] {
            width: 300px;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
<h2>2BiIOM-DTI 报文生成器</h2>
<div>
    <label for="infoInput">输入DTI状态（例如，1123 表示4个DTI状态）:</label><br>
    <input type="text" id="infoInput" placeholder="请输入1, 2或3表示每个DTI状态">
</div>
<button onclick="generateMessage()">生成报文</button>
<div id="output"></div>

<script>
    function generateMessage() {
        const infoInput = document.getElementById('infoInput').value.trim();
        const outputDiv = document.getElementById('output');

        // 验证INFO输入（只能包含1, 2, 或3）
        if (!/^[1-3]*$/.test(infoInput)) {
            outputDiv.innerText = "错误：INFO只能包含1、2或3字符。";
            return;
        }

        // 常量
        const SOI = 0x7E; // 信息起始标志，十六进制传输
        const EOI = 0x0D; // 信息结束标志，十六进制传输

        // 步骤1：准备INFO
        const info = infoInput || ""; // 如果为空，INFO为空
        const infoLength = info.length;

        // 步骤2：计算LENGTH字段
        // LENID是INFO的ASCII字节数，假设为12位（3个nibble）
        const lenid = infoLength;
        const lenidBinary = lenid.toString(2).padStart(12, '0');
        // 提取高nibble (bits 8-11)，中 (bits 4-7)，低 (bits 0-3)
        const highBits = parseInt(lenidBinary.slice(0, 4), 2);
        const midBits = parseInt(lenidBinary.slice(4, 8), 2);
        const lowBits = parseInt(lenidBinary.slice(8, 12), 2);
        // 计算LCHKSUM: (high + mid + low) mod 16，取反加1（4位）
        const nibbleSum = highBits + midBits + lowBits;
        const lchksum = ((~ (nibbleSum % 16) & 0xF) + 1) & 0xF;
        // 转换为单个十六进制ASCII字符
        const lchksumAscii = lchksum.toString(16).toUpperCase();
        const highAscii = highBits.toString(16).toUpperCase();
        const midAscii = midBits.toString(16).toUpperCase();
        const lowAscii = lowBits.toString(16).toUpperCase();
        const lengthField = lchksumAscii + highAscii + midAscii + lowAscii;

        // 步骤3：计算CHKSUM
        // 求和LENGTH和INFO的ASCII值
        let sum = 0;
        for (let i = 0; i < lengthField.length; i++) {
            sum += lengthField.charCodeAt(i);
        }
        for (let i = 0; i < info.length; i++) {
            sum += info.charCodeAt(i);
        }
        // CHKSUM = (~sum + 1) mod 65536（16位取反加1），转换为4个ASCII字符
        const chksum = ((~sum & 0xFFFF) + 1) & 0xFFFF;
        const chksumHex = chksum.toString(16).toUpperCase().padStart(4, '0');
        const chksumAscii = chksumHex;

        // 步骤4：构造报文字符串（SOI和EOI为原始字节，其他为ASCII字符）
        const messageStr = String.fromCharCode(SOI) + lengthField + info + chksumAscii + String.fromCharCode(EOI);

        // 转换为十六进制字节序列显示
        const messageHex = Array.from(messageStr, c => c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')).join(' ');

        // 显示结果
        outputDiv.innerText = `生成的报文（十六进制）：${messageHex}\n` +
            `详细分解：\n` +
            `SOI: 7E (十六进制，传输为0x7E，字符表示为~)\n` +
            `LENGTH: ${lengthField} (LCHKSUM=${lchksumAscii}, LENID=${lenid})\n` +
            `INFO: ${info || '无'}\n` +
            `CHKSUM: ${chksumAscii} (4字节ASCII)\n` +
            `EOI: 0D (十六进制，传输为0x0D，字符表示为CR)`;
    }
</script>
</body>
</html>
