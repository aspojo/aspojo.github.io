<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>计轴报警报文解析器（支持上传配置文件）</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background:#f5f5f5; margin:20px; line-height:1.6; }
        h1, h2 { color:#2c3e50; }
        textarea { width:100%; max-width:900px; height:140px; padding:12px; font-family:Consolas; font-size:14px; border:1px solid #ccc; border-radius:6px; }
        button { margin:12px 8px 12px 0; padding:10px 24px; font-size:16px; background:#3498db; color:white; border:none; border-radius:6px; cursor:pointer; }
        button:hover { background:#2980b9; }
        button:disabled { background:#bdc3c7; cursor:not-allowed; }
        #result { margin-top:20px; background:white; border:1px solid #ddd; border-radius:8px; padding:20px; font-family:Consolas; white-space:pre-wrap; line-height:1.5; max-width:1100px; overflow-x:auto; }
        .section { margin:20px 0; padding:12px; border-left:4px solid #3498db; background:#f9f9f9; }
        .normal { color:#27ae60; font-weight:bold; }
        .alarm { color:#c0392b; font-weight:bold; }
        .warn { color:#e67e22; font-weight:bold; }
        table { border-collapse:collapse; width:100%; margin:10px 0; }
        th, td { border:1px solid #ddd; padding:8px; text-align:left; }
        th { background:#ecf0f1; }
        .upload-area { margin:20px 0; padding:15px; background:#fff; border:2px dashed #3498db; border-radius:8px; text-align:center; }
        #configStatus { font-weight:bold; margin:10px 0; }
    </style>
</head>
<body>
<h1>计轴 → BiIOM 报警报文解析器（支持上传配置文件）</h1>

<div class="upload-area">
    <p>第一步：上传配置文件（.xml）</p>
    <input type="file" id="configFile" accept=".xml" />
    <button onclick="loadConfig()">加载配置文件</button>
    <div id="configStatus">尚未加载配置文件</div>
</div>

<p>第二步：粘贴完整十六进制报文（支持带空格）</p>
<textarea id="hexInput" placeholder="例如：AA 00 BF 70 1A 01 15 11 0A 12 ... AA"></textarea>
<br/>
<button id="parseBtn" onclick="parseMessage()" disabled>解析报文（需先加载配置文件）</button>

<div id="result"></div>

<script>
    // ===================== 全局变量 =====================
    let config = null; // 存储解析后的配置对象

    // ===================== 加载并解析 XML 配置文件 =====================
    function loadConfig() {
        const fileInput = document.getElementById('configFile');
        const statusDiv = document.getElementById('configStatus');
        const parseBtn = document.getElementById('parseBtn');

        if (!fileInput.files.length) {
            statusDiv.innerHTML = '<span class="warn">请先选择一个 .xml 文件</span>';
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const xmlText = e.target.result;
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                config = {
                    secAlarms: [],
                    sensorAlarms: [],
                    amplifierBoards: [],
                    axleBoards: [],
                    outputBoards: [],
                    commBoards: []
                };

                // 读取 SecAlarms
                xmlDoc.querySelectorAll('SecAlarms Item').forEach(item => {
                    config.secAlarms.push(item.getAttribute('Name'));
                });

                // SensorAlarms
                xmlDoc.querySelectorAll('SensorAlarms Item').forEach(item => {
                    config.sensorAlarms.push(item.getAttribute('Name'));
                });

                // AmplifierBoardAlarms
                xmlDoc.querySelectorAll('AmplifierBoardAlarms Item').forEach(item => {
                    config.amplifierBoards.push(item.getAttribute('Name'));
                });

                // AxleBoardAlarms
                xmlDoc.querySelectorAll('AxleBoardAlarms Item').forEach(item => {
                    config.axleBoards.push(item.getAttribute('Name'));
                });

                // OutputBoardAlarms
                xmlDoc.querySelectorAll('OutputBoardAlarms Item').forEach(item => {
                    config.outputBoards.push(item.getAttribute('Name'));
                });

                // CommunicationBoardAlarms（每块板 2 个 CPU）
                xmlDoc.querySelectorAll('CommunicationBoardAlarms Item').forEach(item => {
                    const name = item.getAttribute('Name');
                    config.commBoards.push(`${name} CPU0`);
                    config.commBoards.push(`${name} CPU1`);
                });

                statusDiv.innerHTML = `<span class="normal">配置文件加载成功！</span><br>
                        • 区段: ${config.secAlarms.length} 个<br>
                        • 传感器: ${config.sensorAlarms.length} 个<br>
                        • 放大板: ${config.amplifierBoards.length} 个<br>
                        • 计轴板: ${config.axleBoards.length} 个<br>
                        • 输出板: ${config.outputBoards.length} 个<br>
                        • 通信板 CPU: ${config.commBoards.length} 个`;

                parseBtn.disabled = false;
            } catch (err) {
                statusDiv.innerHTML = `<span class="warn">XML 解析失败：${err.message}</span>`;
            }
        };

        reader.readAsText(file);
    }

    // ===================== 解析报文 =====================
    function parseMessage() {
        if (!config) {
            document.getElementById('result').innerHTML = '<span class="warn">请先加载配置文件！</span>';
            return;
        }

        const input = document.getElementById("hexInput").value.trim();
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        let hexStr = input.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
        if (hexStr.length % 2 !== 0 || hexStr.length < 20) {
            resultDiv.innerHTML = '<span class="warn">输入格式错误：必须是有效的十六进制字符串</span>';
            return;
        }

        const bytes = [];
        for (let i = 0; i < hexStr.length; i += 2) {
            bytes.push(parseInt(hexStr.substr(i, 2), 16));
        }

        if (bytes[0] !== 0xAA || bytes[bytes.length-1] !== 0xAA) {
            resultDiv.innerHTML += '<span class="warn">帧头或帧尾不是 0xAA</span><br>';
        }

        const len = (bytes[1] << 8) | bytes[2];
        if (len !== bytes.length) {
            resultDiv.innerHTML += `<span class="warn">长度不匹配：声明=${len}，实际=${bytes.length}</span><br>`;
        }

        let pos = 0;
        let html = '<h2>解析结果</h2>';

        // 头部信息
        html += `<div class="section">`;
        html += `<strong>HEADER</strong>: 0xAA<br>`;
        pos++;
        html += `<strong>LEN</strong>: ${len}<br>`;
        pos += 2;
        html += `<strong>MSG_ID</strong>: 0x${bytes[pos++].toString(16).padStart(2,'0')} (报警报文)<br>`;

        // 时间戳
        const y = bytes[pos++].toString(16).padStart(2,'0');
        const m = bytes[pos++].toString(16).padStart(2,'0');
        const d = bytes[pos++].toString(16).padStart(2,'0');
        const h = bytes[pos++].toString(16).padStart(2,'0');
        const min = bytes[pos++].toString(16).padStart(2,'0');
        const s = bytes[pos++].toString(16).padStart(2,'0');
        html += `<strong>时间</strong>: 20${y}-${m}-${d} ${h}:${min}:${s}<br>`;

        // SN
        const sn = ((bytes[pos] << 24) | (bytes[pos+1] << 16) | (bytes[pos+2] << 8) | bytes[pos+3]) >>> 0;
        html += `<strong>SN</strong>: ${sn} (0x${sn.toString(16).toUpperCase().padStart(8,'0')})<br>`;
        pos += 4;

        // AXLE_INDEX
        const axleIdx = (bytes[pos] << 8) | bytes[pos+1];
        html += `<strong>AXLE_INDEX</strong>: ${axleIdx} (0x${axleIdx.toString(16).padStart(4,'0')})<br>`;
        pos += 2;
        html += '</div>';

        // ===================== 区段报警 =====================
        html += '<div class="section"><h3>区段报警状态 (SecAlarms)</h3><table>';
        html += '<tr><th>序号</th><th>名称</th><th>状态</th></tr>';
        for (let i = 0; i < config.secAlarms.length && pos < bytes.length; i++) {
            const val = bytes[pos++];
            const status = val === 0x01 ? '<span class="normal">正常</span>' : (val === 0x02 ? '<span class="alarm">报警</span>' : `<span class="warn">未知(${val.toString(16)})</span>`);
            html += `<tr><td>${i}</td><td>${config.secAlarms[i]}</td><td>${status}</td></tr>`;
        }
        html += '</table></div>';

        // ===================== 传感器报警 =====================
        html += '<div class="section"><h3>传感器报警状态 (SensorAlarms)</h3><table>';
        html += '<tr><th>序号</th><th>名称</th><th>状态</th></tr>';
        for (let i = 0; i < config.sensorAlarms.length && pos < bytes.length; i++) {
            const val = bytes[pos++];
            const status = val === 0x01 ? '<span class="normal">正常</span>' : (val === 0x02 ? '<span class="alarm">报警</span>' : `<span class="warn">未知(${val.toString(16)})</span>`);
            html += `<tr><td>${i}</td><td>${config.sensorAlarms[i]}</td><td>${status}</td></tr>`;
        }
        html += '</table></div>';

        // ===================== 放大板 =====================
        html += '<div class="section"><h3>放大板状态 (AmplifierBoardAlarms)</h3><table>';
        html += '<tr><th>序号</th><th>名称</th><th>状态</th></tr>';
        for (let i = 0; i < config.amplifierBoards.length && pos < bytes.length; i++) {
            const val = bytes[pos++];
            const status = val === 0x01 ? '<span class="normal">正常</span>' : (val === 0x02 ? '<span class="alarm">异常</span>' : `<span class="warn">未知(${val.toString(16)})</span>`);
            html += `<tr><td>${i}</td><td>${config.amplifierBoards[i]}</td><td>${status}</td></tr>`;
        }
        html += '</table></div>';

        // ===================== 计轴板 =====================
        html += '<div class="section"><h3>计轴板状态 (AxleBoardAlarms)</h3><table>';
        html += '<tr><th>序号</th><th>名称</th><th>状态</th></tr>';
        for (let i = 0; i < config.axleBoards.length && pos < bytes.length; i++) {
            const val = bytes[pos++];
            const status = val === 0x01 ? '<span class="normal">正常</span>' : (val === 0x02 ? '<span class="alarm">异常</span>' : `<span class="warn">未知(${val.toString(16)})</span>`);
            html += `<tr><td>${i}</td><td>${config.axleBoards[i]}</td><td>${status}</td></tr>`;
        }
        html += '</table></div>';

        // ===================== 输出板 =====================
        html += '<div class="section"><h3>输出板状态 (OutputBoardAlarms)</h3><table>';
        html += '<tr><th>序号</th><th>名称</th><th>状态</th></tr>';
        for (let i = 0; i < config.outputBoards.length && pos < bytes.length; i++) {
            const val = bytes[pos++];
            const status = val === 0x01 ? '<span class="normal">正常</span>' : (val === 0x02 ? '<span class="alarm">异常</span>' : `<span class="warn">未知(${val.toString(16)})</span>`);
            html += `<tr><td>${i}</td><td>${config.outputBoards[i]}</td><td>${status}</td></tr>`;
        }
        html += '</table></div>';

        // ===================== AXLE_TYPE_NUM =====================
        if (pos + 1 < bytes.length && bytes[pos] === 0x00 && bytes[pos+1] === 0x03) {
            html += '<div class="section"><strong>AXLE_TYPE_NUM</strong>: 0x0003 (固定值)</div>';
            pos += 2;
        } else {
            html += '<div class="section"><span class="warn">未找到 AXLE_TYPE_NUM 0x0003</span></div>';
        }

        // ===================== 通信板 =====================
        html += '<div class="section"><h3>通信板 CPU 状态与故障码</h3>';
        for (let i = 0; i < config.commBoards.length && pos + 2 < bytes.length; i++) {
            const status = bytes[pos++];
            const errHigh = bytes[pos++];
            const errLow = bytes[pos++];
            const errCode = (errHigh << 8) | errLow;
            html += `<p><strong>${config.commBoards[i]}</strong>: 状态 0x${status.toString(16).padStart(2,'0')}，故障码 0x${errCode.toString(16).padStart(4,'0').toUpperCase()}</p>`;
        }
        html += '</div>';

        // ===================== 剩余字段（电源/机柜/告警） =====================
        html += '<div class="section"><h3>剩余字段（电源/机柜/告警）</h3>';
        while (pos < bytes.length - 1) {
            html += `0x${bytes[pos++].toString(16).padStart(2,'0')} `;
        }
        if (pos < bytes.length) {
            const axleErr = bytes[pos++];
            html += `<br><strong>AXLE_ERROR</strong>: 0x${axleErr.toString(16).padStart(2,'0')} → ${axleErr === 0x01 ? '<span class="alarm">有告警</span>' : axleErr === 0x02 ? '<span class="normal">无告警</span>' : '初始化'}</div>`;
        }
        html += `<strong>END</strong>: 0xAA`;

        resultDiv.innerHTML = html;
    }
</script>
</body>
</html>
