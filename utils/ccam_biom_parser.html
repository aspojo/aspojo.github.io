<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCAM->BiIOM 报文解析器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 30px;
            margin-bottom: 20px;
        }
        .input-section {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .result-section {
            margin-top: 30px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .field-name {
            font-weight: 600;
            color: #333;
        }
        .field-value {
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .field-hex {
            color: #007bff;
        }
        .field-dec {
            color: #28a745;
        }
        .field-bin {
            color: #dc3545;
        }
        .field-str {
            color: #6c757d;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-valid {
            background: #d4edda;
            color: #155724;
        }
        .status-invalid {
            background: #f8d7da;
            color: #721c24;
        }
        .status-warning {
            background: #fff3cd;
            color: #856404;
        }
        .frame-type, .msg-num, .pub-msg-id, .prv-msg-id {
            font-weight: 700;
        }
        .crc-valid {
            color: #28a745;
        }
        .crc-invalid {
            color: #dc3545;
            font-weight: 700;
        }
        .expandable {
            cursor: pointer;
            user-select: none;
        }
        .expandable::before {
            content: '▶ ';
            font-size: 10px;
            transition: transform 0.3s;
        }
        .expandable.expanded::before {
            transform: rotate(90deg);
        }
        .hidden {
            display: none;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #155724;
        }
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #856404;
        }
        .error-box {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #721c24;
        }
        .sub-section {
            margin-left: 20px;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .hex-preview {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .hex-preview .offset {
            color: #888;
            margin-right: 15px;
        }
        .hex-preview .hex {
            color: #66d9ef;
        }
        .hex-preview .ascii {
            color: #a6e22e;
            margin-left: 20px;
        }
        .highlight {
            background: #ffeb3b !important;
            color: #333 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CCAM → BiIOM 报文解析器</h1>
        
        <div class="main-card">
            <div class="input-section">
                <label for="hexInput">十六进制报文数据（空格分隔）</label>
                <textarea id="hexInput" placeholder="请输入十六进制报文数据，例如：FF 00 4A 10 AA 00 01 20 AA 00 20 00 00 00 01 01 CA ..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-primary" onclick="parseMessage()">开始解析</button>
                    <button class="btn-secondary" onclick="loadExample()">加载示例数据</button>
                    <button class="btn-secondary" onclick="clearInput()">清空输入</button>
                </div>
            </div>
            
            <div id="parseResult" class="result-section hidden">
                <div class="section-title">解析结果</div>
                
                <div id="hexDisplay" class="hex-preview"></div>
                
                <div class="info-box">
                    <strong>帧基本信息：</strong>
                    <span id="frameInfo"></span>
                </div>
                
                <div id="frameDetails"></div>
            </div>
        </div>
    </div>

    <script>
        const CRC32_TABLE = [];
        (function() {
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let j = 0; j < 8; j++) {
                    c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                }
                CRC32_TABLE[i] = c;
            }
        })();

        function crc32(data) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < data.length; i++) {
                crc = CRC32_TABLE[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function hexToBytes(hexStr) {
            const clean = hexStr.replace(/[^0-9A-Fa-f]/g, '');
            const bytes = [];
            for (let i = 0; i < clean.length; i += 2) {
                bytes.push(parseInt(clean.substr(i, 2), 16));
            }
            return bytes;
        }

        function bytesToHex(bytes) {
            return bytes.map(b => ('0' + b.toString(16).toUpperCase()).slice(-2)).join(' ');
        }

        function readUInt8(bytes, offset) {
            return bytes[offset] & 0xFF;
        }

        function readUInt16BE(bytes, offset) {
            return ((bytes[offset] & 0xFF) << 8) | (bytes[offset + 1] & 0xFF);
        }

        function readUInt32BE(bytes, offset) {
            return ((bytes[offset] & 0xFF) << 24) | 
                   ((bytes[offset + 1] & 0xFF) << 16) | 
                   ((bytes[offset + 2] & 0xFF) << 8) | 
                   (bytes[offset + 3] & 0xFF);
        }

        function readInt8(bytes, offset) {
            const val = bytes[offset] & 0xFF;
            return val > 127 ? val - 256 : val;
        }

        function readInt16BE(bytes, offset) {
            const val = readUInt16BE(bytes, offset);
            return val > 32767 ? val - 65536 : val;
        }

        function readInt32BE(bytes, offset) {
            const val = readUInt32BE(bytes, offset);
            return val > 2147483647 ? val - 4294967296 : val;
        }

        function formatHex(val, length) {
            return '0x' + ('0'.repeat(length * 2) + val.toString(16).toUpperCase()).slice(-length * 2);
        }

        function formatBinary(val, length) {
            return '0b' + ('0'.repeat(length * 8) + val.toString(2)).slice(-length * 8);
        }

        function parseSrcId(bytes, offset) {
            const byte1 = bytes[offset] & 0xFF;
            const byte2 = bytes[offset + 1] & 0xFF;
            const byte3 = bytes[offset + 2] & 0xFF;
            const byte4 = bytes[offset + 3] & 0xFF;
            
            const trainId = ((byte3 << 8) | byte4) >>> 2;
            const carEnd = ((byte3 << 8) | byte4) & 0x03;
            const carEndStr = carEnd === 1 ? '1车' : carEnd === 2 ? '6车' : '未知(' + carEnd + ')';
            
            return {
                byte1: byte1,
                byte2: byte2,
                byte3: byte3,
                byte4: byte4,
                trainId: trainId,
                carEnd: carEnd,
                carEndStr: carEndStr,
                valid: byte1 === 0x10
            };
        }

        function parseDstId(bytes, offset) {
            const byte1 = bytes[offset] & 0xFF;
            const byte2 = bytes[offset + 1] & 0xFF;
            const byte3 = bytes[offset + 2] & 0xFF;
            const byte4 = bytes[offset + 3] & 0xFF;
            
            const opsId = ((byte3 << 8) | byte4) & 0xFFFF;
            
            return {
                byte1: byte1,
                byte2: byte2,
                byte3: byte3,
                byte4: byte4,
                opsId: opsId,
                valid: byte1 === 0x20 && opsId === 0x0020
            };
        }

        function parseTime(bytes, offset) {
            const year = bytes[offset] & 0xFF;
            const month = bytes[offset + 1] & 0xFF;
            const day = bytes[offset + 2] & 0xFF;
            const hour = bytes[offset + 3] & 0xFF;
            const minute = bytes[offset + 4] & 0xFF;
            const second = bytes[offset + 5] & 0xFF;
            
            return {
                year: year + 2000,
                month: month,
                day: day,
                hour: hour,
                minute: minute,
                second: second,
                formatted: `${year + 2000}-${('0' + month).slice(-2)}-${('0' + day).slice(-2)} ${('0' + hour).slice(-2)}:${('0' + minute).slice(-2)}:${('0' + second).slice(-2)}`
            };
        }

        function parsePubMsg(bytes, offset) {
            const fields = [];
            
            fields.push({ name: 'MsgId', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset) });
            offset += 1;
            
            fields.push({ name: 'VerNo', offset: offset, length: 2, type: 'UInt16', value: readUInt16BE(bytes, offset) });
            offset += 2;
            
            const time = parseTime(bytes, offset);
            fields.push({ name: 'Time', offset: offset, length: 6, type: 'UInt8[6]', value: time.formatted, raw: bytes.slice(offset, offset + 6) });
            offset += 6;
            
            fields.push({ name: 'DrvId', offset: offset, length: 2, type: 'UInt16', value: readUInt16BE(bytes, offset) });
            offset += 2;
            
            fields.push({ name: 'HDrvMode', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getHDrvModeDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'CtrlLevel', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getCtrlLevelDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'DrvMode', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getDrvModeDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'Speed', offset: offset, length: 2, type: 'UInt16', value: readUInt16BE(bytes, offset), unit: 'km/h' });
            offset += 2;
            
            fields.push({ name: 'EbSpeed', offset: offset, length: 2, type: 'UInt16', value: readUInt16BE(bytes, offset), unit: 'km/h' });
            offset += 2;
            
            fields.push({ name: 'AtpFault', offset: offset, length: 4, type: 'UInt8[4]', value: bytesToHex(bytes.slice(offset, offset + 4)) });
            offset += 4;
            
            fields.push({ name: 'InitRst', offset: offset, length: 4, type: 'UInt8[4]', value: bytesToHex(bytes.slice(offset, offset + 4)) });
            offset += 4;
            
            fields.push({ name: 'DevFault', offset: offset, length: 2, type: 'UInt8[2]', value: bytesToHex(bytes.slice(offset, offset + 2)) });
            offset += 2;
            
            fields.push({ name: 'AtoFault', offset: offset, length: 4, type: 'UInt8[4]', value: bytesToHex(bytes.slice(offset, offset + 4)) });
            offset += 4;
            
            fields.push({ name: 'PlatformId', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtoOptFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrnCutOff', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrnCutOffRsn', offset: offset, length: 8, type: 'UInt8[8]', value: bytesToHex(bytes.slice(offset, offset + 8)) });
            offset += 8;
            
            fields.push({ name: 'AtpFsb', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'AtpFsbRsn', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtpEb', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'AtpEbRsn', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtpLoseLoc', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'AtpLoseLocRsn', offset: offset, length: 4, type: 'UInt8[4]', value: bytesToHex(bytes.slice(offset, offset + 4)) });
            offset += 4;
            
            fields.push({ name: 'TrnBrkFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'FullLoadRto', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'MapVer', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtpVer', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtoVer', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'MmiVer', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'AtpStopPrec', offset: offset, length: 1, type: 'Int8', value: readInt8(bytes, offset), unit: 'cm' });
            offset += 1;
            
            fields.push({ name: 'AtoStopPrec', offset: offset, length: 1, type: 'Int8', value: readInt8(bytes, offset), unit: 'cm' });
            offset += 1;
            
            fields.push({ name: 'CheckResult', offset: offset, length: 6, type: 'UInt8[6]', value: bytesToHex(bytes.slice(offset, offset + 6)) });
            offset += 6;
            
            fields.push({ name: 'Zc1Id', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'Zc1ComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'Zc2Id', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'Zc2ComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'Ats1Id', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'Ats1ComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'Ats2Id', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'Ats2ComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'CbiId', offset: offset, length: 4, type: 'UInt32', value: readUInt32BE(bytes, offset) });
            offset += 4;
            
            fields.push({ name: 'CbiComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrnComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TmsComFault', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'HeadOrTrail', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getHeadOrTrailDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'ExtendInitRst', offset: offset, length: 8, type: 'UInt8[8]', value: bytesToHex(bytes.slice(offset, offset + 8)) });
            offset += 8;
            
            fields.push({ name: 'IsWakeUpInit', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrnRsv', offset: offset, length: 1, type: 'UInt8[]', value: bytesToHex(bytes.slice(offset, offset + 1)) });
            offset += 1;
            
            const crcValue = readUInt32BE(bytes, offset);
            fields.push({ name: 'PubMsg CRC', offset: offset, length: 4, type: 'UInt32', value: formatHex(crcValue, 4) });
            offset += 4;
            
            return { fields, totalLength: offset };
        }

        function parsePrvMsg(bytes, offset) {
            const fields = [];
            
            fields.push({ name: 'MsgId', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset) });
            offset += 1;
            
            fields.push({ name: 'AtpCutOff', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'HostStyle/SubSystem', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset) });
            offset += 1;
            
            fields.push({ name: 'SyncState', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'ModBtnPress', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'WheelDiaCalFail', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrnAbnMove', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'RunOverTime', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'DoorStateBypass', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'DoorUseBypass', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'DoorOCAbr', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'PltTrainDoorDiffer', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrainDoorOpenAbr', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'EmergencyExitAbr', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'EBFailure', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TractionAlarm', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'ObstacleAlarm', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'StopAlignment', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'UndervoltageAlarm', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;
            
            fields.push({ name: 'TrainFireAlarm', offset: offset, length: 1, type: 'UInt8', value: readUInt8(bytes, offset), desc: getBoolDesc(readUInt8(bytes, offset)) });
            offset += 1;

        }

        function getCtrlLevelDesc(val) {
            const map = { 0: '无', 1: 'L1', 2: 'L2', 3: 'L3', 4: 'L4' };
            return map[val] || '未知(' + val + ')';
        }

        function getDrvModeDesc(val) {
            const map = { 0: '牵引', 1: '制动', 2: '惰行', 3: '停车' };
            return map[val] || '未知(' + val + ')';
        }

        function getBoolDesc(val) {
            return val === 0 ? '否' : val === 1 ? '是' : '异常(' + val + ')';
        }

        function getHeadOrTrailDesc(val) {
            return val === 0 ? '尾部' : val === 1 ? '头部' : '未知(' + val + ')';
        }

        function getTrainDirDesc(val) {
            return val === 0 ? '向前' : val === 1 ? '向后' : '未知(' + val + ')';
        }

        function generateHexDisplay(bytes, highlightRanges) {
            let html = '';
            for (let i = 0; i < bytes.length; i += 16) {
                const line = bytes.slice(i, Math.min(i + 16, bytes.length));
                let hexLine = '';
                let asciiLine = '';
                
                for (let j = 0; j < line.length; j++) {
                    const byte = line[j];
                    const absIdx = i + j;
                    const isHighlighted = highlightRanges.some(r => absIdx >= r.start && absIdx < r.end);
                    const hexClass = isHighlighted ? 'hex highlight' : 'hex';
                    
                    hexLine += `<span class="${hexClass}">${('0' + byte.toString(16).toUpperCase()).slice(-2)}</span> `;
                    asciiLine += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                }
                
                html += `<span class="offset">${('0000' + i.toString(16).toUpperCase()).slice(-4)}:</span>${hexLine.padEnd(52)}<span class="ascii">${asciiLine}</span>\n`;
            }
            return html;
        }

        function generateFrameTable(fields) {
            let html = '<table><thead><tr><th>序号</th><th>字段名</th><th>偏移</th><th>长度</th><th>类型</th><th>十六进制</th><th>十进制</th><th>说明</th></tr></thead><tbody>';
            fields.forEach((field, idx) => {
                const hexVal = field.raw ? bytesToHex(field.raw) : formatHex(field.value, field.length);
                const decVal = field.unit ? field.value + ' ' + field.unit : field.value;
                const desc = field.desc || '';
                
                html += `<tr>
                    <td>${idx + 1}</td>
                    <td class="field-name">${field.name}</td>
                    <td>0x${field.offset.toString(16).toUpperCase()}</td>
                    <td>${field.length} 字节</td>
                    <td>${field.type}</td>
                    <td class="field-value field-hex">${hexVal}</td>
                    <td class="field-value field-dec">${decVal}</td>
                    <td>${desc}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        function parseMessage() {
            const hexInput = document.getElementById('hexInput').value.trim();
            if (!hexInput) {
                alert('请输入十六进制报文数据');
                return;
            }
            
            const bytes = hexToBytes(hexInput);
            if (bytes.length < 20) {
                alert('报文数据过短，至少需要20字节');
                return;
            }
            
            let offset = 0;
            const result = [];
            const highlightRanges = [];
            
            const frameType = readUInt8(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 1, label: 'FrameType' });
            result.push({ name: 'FrameType', offset: offset, length: 1, type: 'UInt8', value: frameType, hex: formatHex(frameType, 1), desc: frameType === 0xFF ? '有效帧标识' : '无效帧标识' });
            offset += 1;
            
            const msgLen = readUInt16BE(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 2, label: 'MsgLen' });
            result.push({ name: 'MsgLen', offset: offset, length: 2, type: 'UInt16', value: msgLen, hex: formatHex(msgLen, 2), desc: `帧长度（从SrcId到CRC）` });
            offset += 2;
            
            const srcId = parseSrcId(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 4, label: 'SrcId' });
            result.push({ name: 'SrcId', offset: offset, length: 4, type: 'UInt8[4]', value: `${srcId.trainId} (${srcId.carEndStr})`, hex: bytesToHex(bytes.slice(offset, offset + 4)), desc: `发送方标识 - 厂家: ${formatHex(srcId.byte2, 1)}, 列车ID: ${srcId.trainId}, 车端: ${srcId.carEndStr}` });
            offset += 4;
            
            const dstId = parseDstId(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 4, label: 'DstId' });
            result.push({ name: 'DstId', offset: offset, length: 4, type: 'UInt8[4]', value: formatHex(dstId.opsId, 2), hex: bytesToHex(bytes.slice(offset, offset + 4)), desc: `接收方标识 - 厂家: ${formatHex(dstId.byte2, 1)}, 运维ID: ${formatHex(dstId.opsId, 2)}` });
            offset += 4;
            
            const sn = readUInt32BE(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 4, label: 'Sn' });
            result.push({ name: 'Sn', offset: offset, length: 4, type: 'UInt32', value: sn, hex: formatHex(sn, 4), desc: '报文序列号' });
            offset += 4;
            
            const msgNum = readUInt8(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 1, label: 'MsgNum' });
            result.push({ name: 'MsgNum', offset: offset, length: 1, type: 'UInt8', value: msgNum, hex: formatHex(msgNum, 1), desc: msgNum === 1 ? '本周期1条消息（无PrvMsg）' : '本周期多条消息' });
            offset += 1;
            
            const pubMsgId = readUInt8(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 1, label: 'PubMsgId' });
            result.push({ name: 'PubMsgId', offset: offset, length: 1, type: 'UInt8', value: pubMsgId, hex: formatHex(pubMsgId, 1), desc: pubMsgId === 202 || pubMsgId === 208 ? '有效固定消息类型' : '未知消息类型' });
            offset += 1;
            
            const pubMsgLen = readUInt16BE(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 2, label: 'PubMsgLen' });
            result.push({ name: 'PubMsgLen', offset: offset, length: 2, type: 'UInt16', value: pubMsgLen, hex: formatHex(pubMsgLen, 2), desc: `PubMsg长度: ${pubMsgLen} 字节` });
            offset += 2;
            
            highlightRanges.push({ start: offset, end: offset + pubMsgLen, label: 'PubMsg' });
            const pubMsgData = bytes.slice(offset, offset + pubMsgLen);
            const pubMsgParsed = parsePubMsg(pubMsgData, 0);
            result.push({ name: 'PubMsg', offset: offset, length: pubMsgLen, type: 'N1', value: bytesToHex(pubMsgData), subFields: pubMsgParsed.fields });
            offset += pubMsgLen;
            
            let prvMsgParsed = null;
            if (msgNum > 1) {
                const prvMsgId = readUInt8(bytes, offset);
                highlightRanges.push({ start: offset, end: offset + 1, label: 'PrvMsgId' });
                result.push({ name: 'PrvMsgId', offset: offset, length: 1, type: 'UInt8', value: prvMsgId, hex: formatHex(prvMsgId, 1), desc: prvMsgId === 203 || prvMsgId === 206 || prvMsgId === 209 ? '有效私有消息类型' : '未知消息类型' });
                offset += 1;
                
                const prvMsgLen = readUInt16BE(bytes, offset);
                highlightRanges.push({ start: offset, end: offset + 2, label: 'PrvMsgLen' });
                result.push({ name: 'PrvMsgLen', offset: offset, length: 2, type: 'UInt16', value: prvMsgLen, hex: formatHex(prvMsgLen, 2), desc: `PrvMsg长度: ${prvMsgLen} 字节` });
                offset += 2;
                
                highlightRanges.push({ start: offset, end: offset + prvMsgLen, label: 'PrvMsg' });
                const prvMsgData = bytes.slice(offset, offset + prvMsgLen);
                prvMsgParsed = parsePrvMsg(prvMsgData, 0);
                result.push({ name: 'PrvMsg', offset: offset, length: prvMsgLen, type: 'N2', value: bytesToHex(prvMsgData), subFields: prvMsgParsed.fields });
                offset += prvMsgLen;
            }
            
            const crcStart = 0;
            const crcEnd = offset;
            const calculatedCrc = crc32(bytes.slice(crcStart, crcEnd));
            const receivedCrc = readUInt32BE(bytes, offset);
            highlightRanges.push({ start: offset, end: offset + 4, label: 'CRC' });
            result.push({ name: 'CRC', offset: offset, length: 4, type: 'UInt32', value: formatHex(receivedCrc, 4), hex: formatHex(receivedCrc, 4), desc: `计算值: ${formatHex(calculatedCrc, 4)}`, crcValid: calculatedCrc === receivedCrc });
            offset += 4;
            
            const hexDisplay = generateHexDisplay(bytes, highlightRanges);
            document.getElementById('hexDisplay').innerHTML = hexDisplay;
            
            let frameInfo = `帧类型: ${frameType === 0xFF ? '<span class="status-valid">有效(0xFF)</span>' : '<span class="status-invalid">无效(0x' + frameType.toString(16).toUpperCase() + ')</span>'}`;
            frameInfo += ` | 帧长度: ${msgLen} 字节 | 序列号: ${sn} | 消息数: ${msgNum}`;
            frameInfo += ` | CRC校验: ${calculatedCrc === receivedCrc ? '<span class="status-valid">通过</span>' : '<span class="status-invalid">失败</span>'}`;
            document.getElementById('frameInfo').innerHTML = frameInfo;
            
            let frameDetails = '<div class="section-title" style="margin-top: 20px;">帧头字段</div>';
            const headerFields = result.filter(f => !f.subFields);
            frameDetails += generateFrameTable(headerFields);
            
            const pubMsgField = result.find(f => f.name === 'PubMsg');
            if (pubMsgField && pubMsgField.subFields) {
                frameDetails += '<div class="section-title" style="margin-top: 30px;">PubMsg (固定格式消息)</div>';
                frameDetails += generateFrameTable(pubMsgField.subFields);
            }
            
            const prvMsgField = result.find(f => f.name === 'PrvMsg');
            if (prvMsgField && prvMsgField.subFields) {
                frameDetails += '<div class="section-title" style="margin-top: 30px;">PrvMsg (私有消息)</div>';
                frameDetails += generateFrameTable(prvMsgField.subFields);
            }
            
            document.getElementById('frameDetails').innerHTML = frameDetails;
            document.getElementById('parseResult').classList.remove('hidden');
        }
