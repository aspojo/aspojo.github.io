<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ZC设备 Protobuf 调试神器 · 真·终极版</title>
    <!-- 强制使用你指定的 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
    <style>
        body {font-family:'Microsoft YaHei',Arial,sans-serif; margin:0; background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:20px 0;}
        .container {max-width:1380px; margin:0 auto; background:#fff; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,0.25); overflow:hidden;}
        header {background:linear-gradient(120deg,#1e3c72,#2a5298); color:white; padding:30px; text-align:center;}
        h1 {margin:0; font-size:32px; font-weight:700;}
        .subtitle {margin:10px 0 0; font-size:17px; opacity:0.95;}
        .content {padding:35px;}
        .card {background:#fafafa; border-radius:16px; padding:25px; margin-bottom:28px; border-left:6px solid #667eea; box-shadow:0 6px 20px rgba(0,0,0,0.08);}
        .card h3 {margin:0 0 18px; color:#1e3c72; font-size:20px; font-weight:600;}
        textarea#protoText {width:100%; min-height:200px; font-family:'JetBrains Mono',Consolas,monospace; font-size:15px; line-height:1.7; padding:20px; border:2px solid #e0e0e0; border-radius:14px; background:#fdfdfd; resize:vertical;}
        ::-webkit-scrollbar {width:14px;}
        ::-webkit-scrollbar-track {background:#f1f1f1; border-radius:10px;}
        ::-webkit-scrollbar-thumb {background:#c0c0c0; border-radius:10px; border:3px solid #f1f1f1;}
        ::-webkit-scrollbar-thumb:hover {background:#a8a8a8;}
        .row {display:flex; align-items:center; flex-wrap:wrap; gap:16px; margin:20px 0;}
        label {font-weight:700; min-width:150px; color:#333;}
        input, select {padding:14px 18px; border:2px solid #e0e0e0; border-radius:12px; font-size:15px;}
        input:focus, select:focus {outline:none; border-color:#667eea; box-shadow:0 0 0 4px rgba(102,126,234,0.15);}
        button {padding:14px 28px; border:none; border-radius:12px; cursor:pointer; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.15); transition:all 0.3s; font-size:15px;}
        button.primary {background:#007bff; color:white;}
        button.success {background:#28a745; color:white;}
        button.danger {background:#dc3545; color:white;}
        button:hover:not(:disabled) {transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.25);}
        button:disabled {background:#6c757d; cursor:not-allowed; transform:none; box-shadow:none;}
        .status {padding:18px; border-radius:14px; text-align:center; font-size:19px; font-weight:700; margin:25px 0; box-shadow:0 6px 20px rgba(0,0,0,0.12);}
        .connected {background:#d4edda; color:#155724;}
        .connecting {background:#fff3cd; color:#856404;}
        .disconnected {background:#f8d7da; color:#721c24;}
        .log {height:520px; overflow-y:auto; background:#1e1e1e; color:#d4d4d4; padding:25px; border-radius:16px; font-family:'JetBrains Mono',monospace; font-size:15px; line-height:1.8; box-shadow:inset 0 6px 20px rgba(0,0,0,0.4);}
        .log .send {color:#79c0ff;}
        .log .receive {color:#a5d6ff;}
        .log .error {color:#f28b82;}
        .log strong {color:#fff;}
        .editor textarea {width:100%; min-height:220px; margin-top:12px; border-radius:12px; padding:16px; border:2px solid #e0e0e0; font-size:15px;}
        footer {text-align:center; padding:20px; color:#888; font-size:14px; background:#f8f9fa;}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>ZC设备 Protobuf 调试神器</h1>
        <div class="subtitle">真·终极版 · 发送按钮永不灰 · 双击即用</div>
    </header>

    <div class="content">
        <div class="card">
            <div class="row">
                <label>WebSocket 地址：</label>
                <input type="text" id="wsUrl" value="ws://192.168.34.128:9617/zc/info" style="flex:1;max-width:580px;">
                <button id="saveUrlBtn" class="primary">保存并连接</button>
            </div>
            <div id="status" class="status disconnected">未连接</div>
        </div>

        <div class="card">
            <h3>ZC完整协议（已内置）</h3>
            <textarea id="protoText">syntax = "proto3";
package demo;

// 请求报文内容
message ZCClientRequestMsg
{
    optional uint32 msg_seq = 1; // 序列号
    optional uint64 time_stamp = 2; // 请求时间
    optional uint32 work_station = 3; // mss station id
    optional uint32 work_device = 4; // mss zc device id
}
// 其他所有 message 保持不变（已完整粘贴）
message BoardVerInfo { optional uint32 version_index = 1; optional string version_value = 2; }
message BoardETag { optional string board_name = 1; optional string bom = 2; optional string bom_version = 3; optional string board_made_sn = 4; optional string pcb_version = 5; optional string made_year = 6; optional string made_month = 7; optional string made_day = 8; optional string made_week = 9; optional string made_fty = 10; optional string made_user1 = 11; optional string made_user2 = 12; optional string mac_eth0 = 13; optional string mac_eth1 = 14; optional string mac_eth2 = 15; optional string mac_eth3 = 16; optional string mac_eth_debug = 17; }
message ZCBoardStatus { optional uint32 board_id = 1; optional uint32 board_device_status = 2; optional uint32 bit_all_status = 3; optional uint32 bit_all_alarm_status = 4; }
message NextZCNetStatus { optional uint32 zc_id = 1; optional uint32 net_status = 2; optional uint32 net_comm_index = 3; }
message CBIDetailStatus { optional uint32 cbi_id = 1; optional uint32 cbi_status = 2; optional uint32 cbi_comm_index = 3; }
message TrainDetailStatus { optional uint32 train_pvid = 1; optional uint32 train_status = 2; optional uint32 train_comm_index = 3; }
message NextZCDetailStatus { optional uint32 zc_id = 1; optional uint32 zc_status = 2; optional uint32 zc_comm_index = 3; }
message AxleDetailStatus { optional uint32 trace_id = 1; optional uint32 trace_status = 2; }
message ATSDetailStatus { optional uint32 ats_status = 1; optional uint32 ats_comm_index = 2; }
message ZCInfo { optional uint32 zc_id = 1; optional uint32 station_id = 2; optional uint32 is_offLine = 3; optional uint32 zc_stat = 4; optional uint32 vote_a = 5; optional uint32 vote_b = 6; optional uint32 host_only = 7; optional string app_ver = 8; optional string plt_ver = 9; optional string cfg_ver = 10; optional string zcm_ver = 11; repeated ZCBoardStatus zc_board_stats = 12; optional uint32 ats_net_stat = 13; optional uint32 cc_net_stat = 14; optional uint32 cbi_net_stat = 15; repeated NextZCNetStatus next_zc_net_stats = 16; repeated CBIDetailStatus cbi_details = 17; repeated TrainDetailStatus train_details = 18; repeated NextZCDetailStatus next_zc_details = 19; repeated AxleDetailStatus axle_details = 20; repeated ATSDetailStatus ats_details = 21; optional uint32 sync_state = 22; optional bool is_ats_float_ip = 23; optional uint32 back_cut_knob_stat = 24; }
message ZCClientMsg { optional uint32 msg_seq = 1; optional uint64 time_stamp = 2; repeated ZCInfo zc_infos = 3; }
message ZCBoardEtagRequestMsg { optional uint32 msg_seq = 1; optional uint64 time_stamp = 2; optional uint32 work_station = 3; optional uint32 board_id = 4; }
message ZCBoardEtagMsg { optional uint32 board_id = 1; optional BoardETag board_tag = 2; }
message ZCBoardVerRequestMsg { optional uint32 msg_seq = 1; optional uint64 time_stamp = 2; optional uint32 work_station = 3; optional uint32 board_id = 4; }
message ZCBoardVerMsg { optional uint32 board_id = 1; repeated BoardVerInfo board_versions = 2; }</textarea>
            <div style="margin-top:15px;">
                <button id="loadProtoBtn" class="success">加载 Proto 定义</button>
                <span id="protoStatus" style="margin-left:15px;font-weight:600;"></span>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <label>发送类型：</label>
                <select id="sendType"></select>
                <button id="sendBtn" class="primary" disabled>发送 Protobuf</button>
            </div>
            <div id="sendEditor" class="editor" style="display:none;">
                <strong>发送的 JSON 数据：</strong>
                <textarea id="sendJson" rows="9"></textarea>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <label>接收解析模式：</label>
                <select id="receiveMode">
                    <option value="auto">自动识别（推荐）</option>
                    <option value="manual">强制指定类型</option>
                </select>
                <select id="receiveType" style="display:none;"></select>
            </div>
        </div>

        <div class="card">
            <button id="connectBtn" class="primary">连接</button>
            <button id="disconnectBtn" class="danger" disabled>断开连接</button>
            <button id="clearBtn" style="background:#6c751d;color:white;">清空日志</button>
        </div>

        <h3 style="margin:30px 0 15px;color:#1e3c72;">通信日志</h3>
        <div id="log" class="log"></div>
    </div>

    <footer>ZC设备专用调试神器 · 真·终极版 · 发送按钮永不灰</footer>
</div>

<script>
    const STORAGE_KEY_URL = 'ws_proto_url_zc';
    const STORAGE_KEY_PROTO = 'ws_proto_content_zc';

    const wsUrlInput = document.getElementById('wsUrl');
    const saveUrlBtn = document.getElementById('saveUrlBtn');
    const protoText = document.getElementById('protoText');
    const loadProtoBtn = document.getElementById('loadProtoBtn');
    const protoStatus = document.getElementById('protoStatus');
    const sendType = document.getElementById('sendType');
    const sendJson = document.getElementById('sendJson');
    const sendEditor = document.getElementById('sendEditor');
    const sendBtn = document.getElementById('sendBtn');
    const receiveMode = document.getElementById('receiveMode');
    const receiveType = document.getElementById('receiveType');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const clearBtn = document.getElementById('clearBtn');

    let socket = null;
    let root = null;
    let messages = {};

    wsUrlInput.value = localStorage.getItem(STORAGE_KEY_URL) || wsUrlInput.value;

    // 关键修复：兼容 protobufjs v7 的 Type 判断
    function isMessageType(obj) {
        return obj && typeof obj.encode === 'function' && typeof obj.decode === 'function';
    }

    // 统一更新发送按钮状态
    function updateSendButtonState() {
        const connected = socket && socket.readyState === WebSocket.OPEN;
        const hasType = !!sendType.value && !!messages[sendType.value];
        sendBtn.disabled = !(connected && hasType);
    }

    loadProtoBtn.onclick = async () => {
        try {
            root = protobuf.parse(protoText.value, { keepCase: true }).root;
            messages = {};
            const options = ['<option value="">请选择消息类型</option>'];

            function collect(ns, prefix = '') {
                for (const [name, item] of Object.entries(ns)) {
                    if (isMessageType(item)) {  // 关键修复：用函数判断
                        const fullName = prefix + name;
                        messages[fullName] = item;
                        options.push(`<option value="${fullName}">${fullName}</option>`);
                    } else if (item && typeof item.nested === 'object') {
                        collect(item.nested, prefix + name + '.');
                    }
                }
            }
            collect(root.nested);

            sendType.innerHTML = options.join('');
            receiveType.innerHTML = options.join('');
            protoStatus.innerHTML = `<span style="color:green">成功加载 ${Object.keys(messages).length} 个消息类型</span>`;
            localStorage.setItem(STORAGE_KEY_PROTO, protoText.value);

            if (options.length > 1) {
                sendType.value = 'ZCClientRequestMsg';
                updateSendEditor();
                updateSendButtonState(); // 立即生效
            }
        } catch (e) {
            protoStatus.innerHTML = `<span style="color:red">解析失败：${e.message}</span>`;
            console.error(e);
        }
    };

    sendType.onchange = () => {
        updateSendEditor();
        updateSendButtonState(); // 选择后立即点亮
    };

    function updateSendEditor() {
        if (!sendType.value || !messages[sendType.value]) {
            sendEditor.style.display = 'none';
            return;
        }
        const type = messages[sendType.value];
        const empty = {};
        if (type.fields) {
            Object.values(type.fields).forEach(f => {
                empty[f.name] = f.repeated ? [] : (f.type === 'string' ? '' : 0);
            });
        }
        sendJson.value = JSON.stringify(empty, null, 2);
        sendEditor.style.display = 'block';
    }

    receiveMode.onchange = () => receiveType.style.display = receiveMode.value === 'manual' ? 'inline-block' : 'none';

    sendBtn.onclick = () => {
        if (!socket || socket.readyState !== WebSocket.OPEN) return alert('未连接');
        const type = messages[sendType.value];
        if (!type) return alert('无效的消息类型');
        try {
            const payload = JSON.parse(sendJson.value);
            const err = type.verify(payload);
            if (err) throw Error(err);
            const buffer = type.encode(type.create(payload)).finish();
            socket.send(buffer);
            log(`发送 ${sendType.value} (${buffer.length} bytes)\n${sendJson.value}`, 'send');
        } catch (e) {
            alert('发送失败：' + e.message);
        }
    };

    function connect() {
        if (socket && (socket.readyState === WebSocket.CONNECTING || socket.readyState === WebSocket.OPEN)) return;
        let url = wsUrlInput.value.trim();
        if (!url.startsWith('ws://')) url = 'ws://' + url.replace(/^wss:\/\//i, '').replace(/^https?:\/\//i, '');
        setStatus(`正在连接 ${url} ...`, 'connecting');
        socket = new WebSocket(url);
        socket.binaryType = 'arraybuffer';

        socket.onopen = () => {
            setStatus(`已连接：${url}`, 'connected');
            log('WebSocket 连接成功', 'info');
            disconnectBtn.disabled = false;
            connectBtn.disabled = true;
            saveUrlBtn.disabled = true;
            updateSendButtonState();
        };

        socket.onmessage = (e) => {
            if (typeof e.data === 'string') { log(`收到文本：${e.data}`, 'receive'); return; }
            const buffer = new Uint8Array(e.data);
            const len = buffer.length;

            if (receiveMode.value === 'manual' && receiveType.value && messages[receiveType.value]) {
                try {
                    const type = messages[receiveType.value];
                    const msg = type.decode(buffer);
                    const obj = type.toObject(msg, { defaults: true });
                    log(`[强制解析] ${receiveType.value} (${len} bytes)\n${JSON.stringify(obj, null, 2)}`, 'receive');
                    return;
                } catch (err) {
                    log(`[强制解析失败] ${receiveType.value}：${err.message}`, 'error');
                }
            }

            let decoded = false;
            for (const [name, type] of Object.entries(messages)) {
                try {
                    const msg = type.decode(buffer);
                    const obj = type.toObject(msg, { defaults: true });
                    log(`[自动识别] ${name} (${len} bytes)\n${JSON.stringify(obj, null, 2)}`, 'receive');
                    decoded = true;
                    break;
                } catch (_) {}
            }
            if (!decoded) log(`收到二进制数据 (${len} bytes)，无法解析`, 'receive');
        };

        socket.onerror = () => log('WebSocket 错误', 'error');
        socket.onclose = (e) => {
            setStatus('连接已关闭', 'disconnected');
            log(`连接关闭 code=${e.code}`, e.code === 1000 ? 'info' : 'error');
            socket = null;
            sendBtn.disabled = true;
            disconnectBtn.disabled = true;
            connectBtn.disabled = false;
            saveUrlBtn.disabled = false;
            updateSendButtonState();
        };
    }

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + cls;
    }

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.innerHTML = `<strong>[${time}]</strong> ${msg.replace(/\n/g, '<br>')}`;
        if (type === 'send') div.classList.add('send');
        if (type === 'receive') div.classList.add('receive');
        if (type === 'error') div.classList.add('error');
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    saveUrlBtn.onclick = () => {
        localStorage.setItem(STORAGE_KEY_URL, wsUrlInput.value.trim());
        if (socket) socket.close();
        connect();
    };
    connectBtn.onclick = connect;
    disconnectBtn.onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            setStatus('正在断开连接...', 'connecting');
            log('正在断开 WebSocket...', 'info');
            socket.close(1000, "手动断开");
        }
    };
    clearBtn.onclick = () => logEl.innerHTML = '';

    sendJson.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
    });

    // 自动加载
    const saved = localStorage.getItem(STORAGE_KEY_PROTO);
    if (saved) protoText.value = saved;
    setTimeout(() => loadProtoBtn.click(), 400);

    log('ZC调试神器已就绪！发送按钮已彻底修复，永不灰！', 'info');
</script>
</body>
</html>
